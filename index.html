<!doctype html>
<html lang="tr" data-page-curtain="true">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f1ed" />
    <title>Ergu Energy - Solution Point</title>
    <link rel="preload" as="image" href="/ergu-icon.png" />
    <!--
      Açılış perdesi: JS ve sayfa verileri inene kadar boş ekran yerine sayfa geçişi perdesi görünür. Görünümü
      PageTransition'daki ana sayfa perdesiyle birebir aynıdır, React onu devralınca bu öğe kaldırılır. Token'lar bu
      anda henüz yüklenmemiş olabileceği için değerler burada yazılıdır (tokens.css ile aynı tutulmalı).
    -->
    <style>
      #boot-curtain {
        position: fixed;
        inset: 0 0 auto;
        z-index: 1050;
        display: grid;
        place-items: center;
        block-size: 100lvh;
        color: #fff;
        background: #da7e21;
      }
      #boot-curtain .emblem {
        display: grid;
        place-items: center;
        inline-size: calc(min(20vw, 15svh, 6.5rem) * 1.75);
        aspect-ratio: 1;
        /* Mobil tarayıcı çubuğundan bağımsız, görünür alanın ortasında. */
        margin-block-end: calc(100lvh - 100dvh);
      }
      #boot-curtain .emblem > * {
        grid-area: 1 / 1;
      }
      #boot-curtain svg {
        inline-size: 100%;
        block-size: 100%;
        overflow: visible;
      }
      #boot-curtain circle {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        transform-box: view-box;
        transform-origin: 50% 50%;
        animation: boot-ring 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      #boot-curtain .outer {
        stroke-width: 1;
        stroke-dasharray: 34 66;
      }
      #boot-curtain .inner {
        stroke-width: 1.6;
        stroke-dasharray: 18 82;
        stroke-dashoffset: 50;
        animation-duration: 1.05s;
        animation-direction: reverse;
      }
      #boot-curtain .icon {
        inline-size: min(20vw, 15svh, 6.5rem);
        aspect-ratio: 1;
        background: currentColor;
        mask: url(/ergu-icon.png) center / contain no-repeat;
      }
      @keyframes boot-ring {
        to {
          transform: rotate(1turn);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-curtain circle {
          animation: none;
        }
      }
    </style>
    <noscript><style>#boot-curtain { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot-curtain" aria-hidden="true">
      <div class="emblem">
        <svg viewBox="0 0 100 100">
          <circle class="outer" cx="50" cy="50" r="47" pathLength="100" />
          <circle class="inner" cx="50" cy="50" r="40" pathLength="100" />
        </svg>
        <span class="icon"></span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
